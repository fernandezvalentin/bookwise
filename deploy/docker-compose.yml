# Production stack for a single server. From this folder:
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build
#
# Only Caddy is reachable from outside (ports 80/443, automatic HTTPS). The web
# app talks to the API over the internal network; the API is also published
# at API_DOMAIN for its interactive docs.

# Not "bookwise": that is the development stack's project (docker-compose.yml
# at the repository root), and sharing the name would mix their containers
# and volumes on a machine that runs both.
name: bookwise-prod

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://bookwise:${POSTGRES_PASSWORD:?}@postgres:5432/bookwise?schema=public
  REDIS_URL: redis://redis:6379/0
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
  SMTP_URL: ${SMTP_URL:?}
  MAIL_FROM: ${MAIL_FROM:?}
  DEMO_OWNER_EMAIL: ${DEMO_OWNER_EMAIL:-}
  DEMO_OWNER_PASSWORD: ${DEMO_OWNER_PASSWORD:-}
  # Requests arrive from Caddy or the web app, both on the private Docker
  # network: trust their X-Forwarded-For so rate limits see the visitor's IP.
  TRUST_PROXY: loopback, uniquelocal

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?}
      API_DOMAIN: ${API_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:3001
      DEMO_BUSINESS_SLUG: barberia-centro
      DEMO_OWNER_EMAIL: ${DEMO_OWNER_EMAIL:-}
      DEMO_OWNER_PASSWORD: ${DEMO_OWNER_PASSWORD:-}
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Applies pending database migrations, then exits. Runs on every `up`.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: build
    restart: 'no'
    working_dir: /app/apps/api
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: bookwise
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bookwise -d bookwise']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only file: queued emails and reminders survive a restart.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
